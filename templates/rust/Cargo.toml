[package]
name = "astrbot-plugin-template"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
astrbot-worker = { path = "../../rust/astrbot-worker", features = ["config-schema"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
