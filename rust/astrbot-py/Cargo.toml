[package]
name = "astrbot-py"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
astrbot-wire = { path = "../astrbot-wire" }
astrbot-worker = { path = "../astrbot-worker" }
futures = "0.3"
pyo3 = { version = "0.27", features = ["extension-module", "abi3-py310"] }
pyo3-async-runtimes = { version = "0.27", features = ["tokio-runtime"] }
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros"] }
tokio-util = "0.7"
