[package]
name = "astrbot-worker"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
description = "Author SDK for AstrBot Rust and native Worker plugins"
publish = true

[features]
default = []
config-schema = ["dep:schemars"]

[dependencies]
astrbot-wire = { path = "../astrbot-wire", version = "0.1.0" }
futures = "0.3"
jsonschema = { version = "0.52.1", default-features = false }
schemars = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "net", "rt", "rt-multi-thread", "sync", "time", "macros"] }
tokio-tungstenite = "0.24"
tokio-util = "0.7"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["process"] }
