[package]
name = "astrbot-wire"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
description = "AstrBot plugin wire contract: protocol-v1 DTOs, bounded framing, cancellable peer, resumable streams, and direct service grants"
publish = true

[dependencies]
jsonschema = { version = "0.52.1", default-features = false }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["io-std", "io-util", "net", "process", "rt", "rt-multi-thread", "sync", "time", "macros"] }
tokio-util = "0.7"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "astrbot-wire-conformance"
path = "src/bin/astrbot-wire-conformance.rs"
