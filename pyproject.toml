[project]
name = "astrbot-sdk"
version = "0.1.0"
description = "Public SDK and plugin runtime for AstrBot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "packaging>=24.2",
    "pyyaml>=6.0",
    "websockets>=13",
]

[project.optional-dependencies]
test = [
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    # Legacy compat replay runs handlers in real Quart/Starlette contexts.
    "quart>=0.20",
    "starlette>=0.47",
    "fastapi>=0.124",
    "aiofiles>=25.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astrbot_sdk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ASYNC"]
